plugins {
    id "com.android.application"
    id "com.facebook.react"
}

react {
    autolinkLibrariesWithApp()
}

def enableSeparateBuildPerCPUArchitecture = false
def enableProguardInReleaseBuilds = false

def reactNativeArchitectures() {
    def value = project.getProperties().get("reactNativeArchitectures")
    return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

android {
    ndkVersion rootProject.ext.ndkVersion
    namespace "com.feedbacksamplereactnativeapp"
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.feedbacksamplereactnativeapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0"
    }

    splits {
        abi {
            reset()
            enable enableSeparateBuildPerCPUArchitecture
            universalApk false
            include(*reactNativeArchitectures())
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('REACT_NATIVE_SAMPLE_UPLOAD_STORE_FILE')) {
                storeFile file(REACT_NATIVE_SAMPLE_UPLOAD_STORE_FILE)
                storePassword REACT_NATIVE_SAMPLE_UPLOAD_STORE_PASSWORD
                keyAlias REACT_NATIVE_SAMPLE_UPLOAD_KEY_ALIAS
                keyPassword REACT_NATIVE_SAMPLE_UPLOAD_KEY_PASSWORD
            } else {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}
